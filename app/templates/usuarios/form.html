{% extends 'base.html' %}
{% block titulo %}{{ 'Editar' if usuario else 'Nuevo' }} usuario{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">{{ 'Editar' if usuario else 'Registrar' }} usuario</h2>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required
                   value="{{ request.form.get('nombre', usuario.nombre if usuario else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" name="email" class="form-control" required
                   value="{{ request.form.get('email', usuario.email if usuario else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña {% if usuario %}<small class="text-muted">(déjala vacía para no cambiarla)</small>{% endif %}</label>
            <input type="password" name="password" class="form-control" {{ '' if usuario else 'required' }}>
          </div>
          <button class="btn btn-primary">Guardar</button>
          <a href="{{ url_for('usuarios.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block titulo %}Usuarios{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0 cd-titulo">Usuarios</h2>
  <a href="{{ url_for('usuarios.nuevo') }}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo usuario</a>
</div>

<div class="table-responsive">
  <table class="table table-striped table-hover bg-white align-middle">
    <thead class="table-dark">
      <tr><th>#</th><th>Nombre</th><th>Correo</th><th class="text-end">Acciones</th></tr>
    </thead>
    <tbody>
      {% for u in usuarios %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.email }}</td>
        <td class="text-end">
          <a href="{{ url_for('usuarios.editar', id=u.id) }}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
          <form action="{{ url_for('usuarios.eliminar', id=u.id) }}" method="post" class="d-inline"
                onsubmit="return confirm('¿Eliminar este usuario?');">
            <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

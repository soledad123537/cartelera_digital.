{% extends 'base.html' %}
{% block titulo %}Categorías{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0 cd-titulo">Categorías</h2>
  <a href="{{ url_for('categorias.nueva') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva categoría</a>
</div>

<div class="table-responsive">
  <table class="table table-striped table-hover bg-white align-middle">
    <thead class="table-dark">
      <tr><th>#</th><th>Nombre</th><th>Descripción</th><th>Anuncios</th><th class="text-end">Acciones</th></tr>
    </thead>
    <tbody>
      {% for c in categorias %}
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.nombre }}</td>
        <td>{{ c.descripcion or '—' }}</td>
        <td><span class="badge text-bg-secondary">{{ c.anuncios|length }}</span></td>
        <td class="text-end">
          <a href="{{ url_for('categorias.editar', id=c.id) }}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
          <form action="{{ url_for('categorias.eliminar', id=c.id) }}" method="post" class="d-inline"
                onsubmit="return confirm('¿Eliminar esta categoría?');">
            <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

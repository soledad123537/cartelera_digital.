{% extends 'base.html' %}
{% block titulo %}{{ 'Editar' if categoria else 'Nueva' }} categoría{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">{{ 'Editar' if categoria else 'Registrar' }} categoría</h2>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required
                   value="{{ request.form.get('nombre', categoria.nombre if categoria else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" name="descripcion" class="form-control"
                   value="{{ request.form.get('descripcion', (categoria.descripcion or '') if categoria else '') }}">
          </div>
          <button class="btn btn-primary">Guardar</button>
          <a href="{{ url_for('categorias.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

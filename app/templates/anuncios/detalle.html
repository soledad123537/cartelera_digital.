{% extends 'base.html' %}
{% block titulo %}{{ anuncio.titulo }}{% endblock %}

{% block contenido %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <span class="badge text-bg-primary mb-2">{{ anuncio.categoria.nombre }}</span>
    <h2 class="h3">{{ anuncio.titulo }}</h2>
    <p class="text-muted">Publicado por {{ anuncio.usuario.nombre }} el {{ anuncio.fecha.strftime('%d/%m/%Y %H:%M') }}</p>
    <hr>
    <p style="white-space: pre-line;">{{ anuncio.contenido }}</p>
  </div>
  <div class="card-footer">
    <a href="{{ url_for('main.inicio') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
  </div>
</div>
{% endblock %}
